<dialog id="dialog"><div class="dialoghead"><h2 id="dt"></h2><button onclick="dialog.close()" aria-label="Close dialog">×</button></div><div id="dc"></div></dialog><div role="status" id="toast"></div><script>const base = {source:'Forecast volume', uplift:35, route:'Current routing', plan:'Fixed timetable', dispatch:'No adjustment', sort:1800, limit:4};

];return `<div class="inspector"><div class="iconline">${boxIcon(stageIcons[stage],stage)}<h3>${stageNames[stage]} settings</h3></div><div class="paramrow">${details[stage]()}</div></div>`}
function builder(){return back()+intro('SIMULATION STUDIO',editing?'Edit draft':'New simulation task',`Jakarta · ${draft.days}-day simulation · Baseline SOP v1.${baselineVersion}`,btn('Save draft',`saveTask('Draft')`,'folder-open')+btn('Run task',`saveTask('Completed')`,'play','primary'))+`<div class="surface"><div class="formstrip"><label>Task name<input maxlength="90" id="taskname" placeholder="e.g. Jakarta champaign surge" value="${esc(nameValue)}" oninput="nameValue=this.value"></label><label>Scenario type<select onchange="type=+this.value">${types.map((s,i)=>`<option value="${i}" ${i===type?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="sectitle builderhead"><h2>Scenario canvas</h2><div class="tools"><small>Load preset</small>${btn('Champaign surge','template(0)')}${btn('LH Planner backtest','template(1)')}${btn('Clear canvas','template(2)',null,'plain')}</div></div><div class="workbench"><div class="palette"><h3>Component library</h3>${['Demand data','Demand modifier','Algorithm','Business rule'].map(g=>`<div class="palettegroup">${g}</div>${parts.flatMap(([n,group,i,k],j)=>group!==g?[]:[`<button draggable="true" ondragstart="event.dataTransfer.setData('application/x-spx-component','${j}')" onclick="applyPart(${j},${i})" title="Add to ${stageNames[i]}">${ico(stageIcons[i])}${n}${((k==='plan'&&n==='LH Planner plan (import)')?draft.plan==='LH Planner plan':(draft[k]===n||k==='uplift'&&draft.uplift>0))?'<span>✓</span>':''}</button>`]).join('')}`).join('')}</div><div class="workarea"><div class="flowgrid">${stageNames.map((n,i)=>`<section class="stage ${stage===i?'focused':''}" style="--tone:${colors[i]}" ondragover="event.preventDefault()" ondrop="dropPart(event,${i})"><button class="stagetitle" onclick="stage=${i};render()">${boxIcon(stageIcons[i],i)}<small>0${i+1} · ${stageTypes[i]}</small><b>${n}</b></button>${slots(i)}</section>`).join('')}</div>${inspector()}<div class="runtime"><strong>Runtime SOP</strong><span>FIFO queues · Hourly ticks · 520 parcels/truck</span></div></div></div><div class="savebar"><span>${['source','route','plan'].filter(k=>draft[k]).length}/3 required components</span></div></div>`+parameterSection()}
function saveTask(status){const name=nameValue.trim();if(!name){notify('Enter a task name.');$('taskname').focus();return}if(status==='Completed'){let missing=['source','route','plan'].find(k=>!draft[k]);if(missing){stage=['source','route','plan'].indexOf(missing);render();notify(`Add a component to ${stageNames[stage]}.`);return}}
  const t={id:editing||Math.max(...tasks.map(t=>t.id))+1,name,type,c:{...draft},ref:{...runtimeDefaults,...baseline,uplift:draft.uplift,source:draft.source,days:draft.days,tier:draft.tier,delay:draft.delay,reps:draft.reps},version:baselineVersion,status,updated:new Date().toISOString()};
  tasks=[t,...tasks.filter(x=>x.id!==t.id)];filter='All tasks';query='';scenarioFilter='All types';if(status==='Draft')go(0);else openTask(t.id);notify(status==='Draft'?'Draft saved':'Simulation completed');persist()}
function back(){return `<div class="backline">${btn('‹  All tasks','go(0)',null,'plain')}</div>`}
const sopFields={loadThreshold:'Departure load (%)',maxWait:'Maximum wait (h)',utilCap:'Usable capacity ratio',cancel:'Allow cancellation',cancelBelow:'Cancel below load (%)',nextWithin:'Next trip within (h)',eta:'Transit ETA'};
function showVal(v){return typeof v==='boolean'?(v?'On':'Off'):String(v)}
function paramInput(k,label,min,max,step=1,off=false){
  return `<label>${label}<input type="number" min="${min}" max="${max}" step="${step}" value="${draft[k]}" required ${off?'disabled':''} onchange="if(this.checkValidity()){draft['${k}']=this.valueAsNumber;render()}else{this.reportValidity();this.value=draft['${k}']}"></label>`;
}
function paramSelect(k,label,values){return `<label>${label}<select onchange="draft['${k}']=${typeof draft[k]==='number'?'+':''}this.value;render()">${opt(values,draft[k])}</select></label>`}
function toggle(k,label,off){return `<label class="checkfield"><input type="checkbox" ${draft[k]?'checked':''} ${off?'disabled':''} onchange="draft['${k}']=this.checked;render()">${label}</label>`}
function parameterSection(){
  const copilot=draft.dispatch==='Copilot dispatch',ref={...runtimeDefaults,...baseline};
  const keys=Object.keys(sopFields).filter(k=>!(copilot&&['cancel','cancelBelow','nextWithin'].includes(k))&&!(!draft.cancel&&['cancelBelow','nextWithin'].includes(k)));
  const summary=changed=>keys.filter(k=>(draft[k]!==ref[k])===changed).map(k=>`<li>${sopFields[k]}: ${changed?showVal(ref[k])+' → ':''}<b>${showVal(draft[k])}</b></li>`).join('')||'<li>None</li>';
  return `<section class="surface topgap"><div class="sectitle builderhead"><h2>Configure parameters</h2><small>Baseline SOP v1.${baselineVersion}</small></div><div class="paramlayout"><div class="paramsheet">
  <section><h3>Simulation window</h3><div class="paramrow">${paramSelect('days','Simulation days',[1,7,14])}<span class="minor">Hourly demand · ${draft.source} · +${draft.uplift}%</span></div></section>
  <section><h3>SOP-4 · Loading and departure</h3><div class="paramrow">${paramInput('loadThreshold',sopFields.loadThreshold,1,100)}${paramInput('maxWait',sopFields.maxWait,0,12)}${paramInput('utilCap',sopFields.utilCap,.1,1,.05)}</div></section>
  <section><h3>SOP-4 · Trip cancellation</h3><div class="paramrow">${toggle('cancel',sopFields.cancel,copilot)}${paramInput('cancelBelow',sopFields.cancelBelow,0,100,1,copilot||!draft.cancel)}${paramInput('nextWithin',sopFields.nextWithin,1,12,1,copilot||!draft.cancel)}</div>${copilot?'<p class="tip">D0 dispatch is managed by Copilot. The cancellation rule is inactive.</p>':''}</section>
  <section><h3>SOP-5 · Transit and engine</h3><div class="paramrow">${paramSelect('eta','Transit ETA percentile',['P50','P80','P95'])}${paramSelect('tier','Demo engine',['T2','T3'])}${toggle('delay','Sample transit delays',draft.tier!=='T3')}${paramInput('reps','Repetitions',1,20,1,draft.tier!=='T3'||!draft.delay)}</div><p class="tip">T2 uses fixed transit times. T3 samples transit delays when enabled. Both use the same hourly dispatch model.</p></section></div>
  <div class="paramsummary"><h3>Compared with baseline</h3><h4>Changed SOP parameters</h4><ul>${summary(true)}</ul><h4>Unchanged SOP parameters</h4><ul>${summary(false)}</ul></div></div>
  <div class="savebar"><span>${draft.days*24} hourly intervals · ${draft.tier==='T3'&&draft.delay?draft.reps:1} run(s) per policy</span><div class="tools">${btn('Save draft',`saveTask('Draft')`,'folder-open')}${btn('Run task',`saveTask('Completed')`,'play','primary')}</div></div></section>`;
}
function parameterReceipt(t){const c=t.c;if(!c.days)return '';return `<details class="surface topgap"><summary class="empty">Run parameters · ${c.days} days · ${c.tier} demo engine · ETA ${c.eta}</summary><div class="empty">Departure at ${c.loadThreshold}% load or after ${c.maxWait} h · Usable capacity ${c.utilCap} × vehicle capacity.<br>Cancellation: ${c.dispatch==='Copilot dispatch'?'managed by Copilot':c.cancel?`below ${c.cancelBelow}% when the next trip is within ${c.nextWithin} h`:'off'}. Transit delay sampling: ${c.tier==='T3'&&c.delay?`${c.reps} repetitions`:'off'}.</div></details>`}
function results(){const pv=run.c.planVersion;return back()+intro(code(run.id),esc(run.name),`${types[run.type]} · ${stamp(run.updated)} WIB`)+`<div class="canvasfoot surface"><span><strong>Configuration</strong> &nbsp; ${run.c.source} (+${run.c.uplift}%) · ${run.c.route} · ${pv?'LH Planner plan · '+esc(pv.label):run.c.plan} · ${run.c.dispatch}</span><span>${fmt(run.c.sort)} parcels/h · ${run.c.limit} docks</span></div>`+planCheckSection(run)+report()+parameterReceipt(run)}

/* =====================================================================
   LH Planner plan import + plan check
   ===================================================================== */
function planInspector(){
  const pv=draft.planVersion;
  const version=pv?`<div class="planver"><div class="pvtop"><span class="pvname">LH Planner · ${esc(pv.label)}</span><span class="pvflag ${pv.flag}">${esc(pv.status)}</span></div>
    <div class="pvmeta">${esc(pv.published)} · ${pv.tripTotal} planned trips · ${pv.stationHours} station-hours</div>
    <div class="pvmeta">${esc(pv.note||'')}</div></div>`
   :`<p class="tip">No plan version yet. Import a published version or a draft to check it.</p>`;
  return `<div class="paramrow insp-grid"><label style="max-width:340px">Source of Long Haul Planning<select onchange="setPlanSource(this.value)">${opt(['Fixed timetable','Long Haul Planning Algo','LH Planner plan'],draft.plan)}</select></label>
  ${version}
  <div class="tools">${btn(pv?'Import another version':'Import LH Planner plan','openPlanImport()','folder-open')}</div>
  <p class="tip">D0 adjustment: <b>${esc(draft.dispatch)}</b></p></div>`;
}
function setPlanSource(v){
  draft.plan=v;
  if(v!=='LH Planner plan')delete draft.planVersion;
  render();
  if(v==='LH Planner plan'&&!draft.planVersion)openPlanImport();
}
function openPlanImport(){
  const rows=plannerVersions.map(v=>`<div class="pvrow${draft.planVersion&&draft.planVersion.id===v.id?' current':''}" onclick="usePlanVersion('${v.id}')">
    <div class="pvmain"><span class="pvlabel">LH Planner · ${esc(v.label)}</span>
    <span class="pvsub">${esc(v.published)} · ${v.tripTotal} trips · ${esc(v.note)}</span></div>
    <span class="pvflag ${v.flag}">${esc(v.status)}</span></div>`).join('');
  modal('Import LH Planner plan', `<p class="sub">Pick a plan version from the planner, or import the plan export (JSON) you want the simulation to check.</p>
  <div class="pvlist">${rows}</div>
  <div class="dropzone" style="margin-top:14px"><b>Import a plan export</b>
  <div class="pvsub" style="font-size:12px;color:#65707f">JSON with one row per sorting centre and hour</div>
  <label class="filelabel">Choose plan JSON<input type="file" accept=".json,application/json" onchange="importPlanFile(this)" hidden></label></div>
  <p class="tip">Shape: <code class="k">{ "version": "2026-W49 · v1", "published_at": "…", "trips": [{ "station": "Cakung SOC", "hour": 0, "trips": 2 }] }</code></p>
  <div class="actions">${btn('Download template','downloadPlanTemplate()',null,'plain')}${btn('Cancel','dialog.close()')}</div>`);
}
function usePlanVersion(id){
  const v=plannerVersions.find(x=>x.id===id);if(!v)return;
  draft.plan='LH Planner plan';draft.planVersion=v;
  dialog.close();render();
  notify(`Plan ${v.label} loaded · run the task to check it`);
}
function importPlanFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const o=JSON.parse(reader.result);
      const rows=Array.isArray(o.trips)?o.trips:[];
      if(!rows.length)throw new Error('no "trips" rows found');
      const trips=[[],[],[]];
      for(let i=0;i<3;i++)for(let h=0;h<24;h++)trips[i][h]=0;
      let matched=0;
      for(const row of rows){
        const i=stations.indexOf(row.station),h=Number(row.hour);
        if(i<0||!(h>=0&&h<24))continue;
        trips[i][h]=Math.max(0,Math.round(Number(row.trips)||0));matched++;
      }
      if(!matched)throw new Error('station names or hours do not match the Jakarta network');
      const pv={id:'import',label:o.version||f.name.replace(/\.json$/i,''),status:'Imported',flag:'pub',published:o.published_at||'imported just now',note:'Imported from '+f.name,trips,stationHours:matched,tripTotal:trips.reduce((a,r)=>a+r.reduce((x,y)=>x+y,0),0)};
      draft.plan='LH Planner plan';draft.planVersion=pv;
      dialog.close();render();
      notify(`Imported ${pv.label} · ${matched} station-hours`);
    }catch(err){notify('Import failed: '+(err.message||'invalid JSON'))}
  };
  reader.readAsText(f);
}
function downloadPlanTemplate(){
  const v=plannerVersions[0],rows=[];
  for(let i=0;i<3;i++)for(let h=0;h<24;h++)rows.push({station:stations[i],hour:h,trips:v.trips[i][h]});
  const blob=new Blob([JSON.stringify({version:'2026-W49 · v1',published_at:'2026-11-27',trips:rows},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='lh-planner-plan-template.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function planCheck(c){
  const pv=c.planVersion;if(!pv||!pv.trips)return null;
  const limit=c.limit||4,tot={planned:0,need:0,under:0,unplanned:0,over:0},rows=[];
  for(let i=0;i<3;i++){
    let planned=0,need=0,under=0,unplanned=0,over=0,worst={h:0,gap:-1};
    for(let h=0;h<24;h++){
      const t=Math.max(0,pv.trips[i][h]|0),n=plannerNeed(i,h,c.uplift);
      planned+=t;need+=n;
      if(t===0&&n>0)unplanned++;else if(t<n)under++;
      if(t>limit)over++;
      if(n-t>worst.gap)worst={h,gap:n-t};
    }
    rows.push({name:stations[i],planned,need,under,unplanned,over,worst});
    tot.planned+=planned;tot.need+=need;tot.under+=under;tot.unplanned+=unplanned;tot.over+=over;
  }
  return {rows,tot,limit,pv,verdict:(tot.unplanned||tot.over)?'bad':tot.under?'warn':'ok'};
}
function planCheckSection(run){
  const pc=planCheck(run.c);if(!pc)return '';
  const v=pc.pv,t=pc.tot;
  const label=t.unplanned||t.over?'Plan fails the check':t.under?'Exceptions to review':'Plan holds';
  const items=[];
  if(t.over)items.push({ic:'truck',h:'Dock limit exceeded',s:`${t.over} station-hours plan more trips than the ${pc.limit}-trip dock limit. The surplus trips cancel on the day and turn into backlog.`});
  if(t.unplanned)items.push({ic:'clipboard-list',h:'Trips missing',s:`${t.unplanned} station-hours have no planned trip while the forecast is non-zero. Those parcels roll to the next day.`});
  if(t.under)items.push({ic:'warehouse',h:'Coverage below forecast',s:`${t.under} station-hours are planned below the volume forecast — the plan is short exactly where volume peaks.`});
  if(!items.length)items.push({ic:'check',h:'No structural exceptions',s:'Every planned hour covers the forecast inside the dock limit.'});
  const worst=pc.rows.reduce((b,r)=>r.worst.gap>(b&&b.r===r?b.gap:-1)?(r.worst.gap>((b&&b.gap)||-1)?{name:r.name,...r.worst,in:r.worst.h,gap:r.worst.gap}:b):b,null);
  return `<section class="surface topgap plancheck">
  <div class="sectitle"><div class="row">${ico('clipboard-list')}<h2>Plan check · LH Planner ${esc(v.label)}</h2></div><span class="verdict ${pc.verdict}">${label}</span></div>
  <div class="canvasfoot"><span><strong>Checked plan</strong> &nbsp; ${esc(v.status)} · ${esc(v.published)} · ${v.tripTotal} planned trips</span><span>3 sorting centres × 24 h · checked against current SOP</span></div>
  <div class="scroll"><table class="tbl">
    <tr><th>Sorting centre</th><th class="n">Planned trips</th><th class="n">Forecast need</th><th class="n">Δ</th><th class="n">Under-planned h</th><th class="n">No-trip h</th><th class="n">Over dock h</th></tr>
    ${pc.rows.map(r=>`<tr><td><strong>${r.name}</strong></td><td class="n">${fmt(r.planned)}</td><td class="n">${fmt(r.need)}</td><td class="n">${r.planned-r.need>0?'+':''}${fmt(r.planned-r.need)}</td><td class="n">${fmt(r.under)}</td><td class="n">${fmt(r.unplanned)}</td><td class="n">${fmt(r.over)}</td></tr>`).join('')}
  </table></div>
  <div class="insight"><h2>Check findings</h2>${items.map((f,i)=>`<div class="finding">${boxIcon(f.ic,i)}<div><h3>${f.h}</h3><small>${esc(f.s)}</small></div></div>`).join('')}
    <p class="tip">Largest single gap: ${worst?worst.name+' at '+String(worst.in).padStart(2,'0')+':00 — '+worst.gap+' trip(s) short of the forecast.':'none'}</p></div>
  </section>`;
}
function render(){$('view').innerHTML=screen==='build'?builder():screen==='result'?results():dashboard()}
if(document.body?.dataset.entry==='editor')startBuilder();else render();
</script></body></html>
