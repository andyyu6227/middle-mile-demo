<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Optimization Toolbox · Middle-Mile Optimization</title>
<!--
  ============================================================================
  Network Optimization Toolbox  —  module page (owner: Network Optimization PM)
  ============================================================================
  WHAT THIS PAGE IS
  * The landing view of the module: ONE static screenshot of the Network Plan
    Studio home page, captured 1:1 (no redraw, no mock-up), plus a status strip
    that says the demo is usable and where to open it.
  * The tool itself is a live app on the internal AI platform:
        http://sg10.aip.mlp.shopee.io/aip-svc-100287/feedback-network/
    It needs the Shopee network (VPN) and its own account, so it is NOT framed
    here any more — framing it broke on the https-hosted Pages copy (mixed
    content) and on any machine off the VPN. Details are one click away, in the
    top-right "Open demo" link.
  * Rendered inside the suite shell (index.html) through modules/registry.js:
        'network-opt': 'modules/network-opt.html'
    It also opens fine on its own (double-click) — no build step, no CDN.

  HOW TO REFRESH THE SCREENSHOT
  1. Open the tool in Chrome, log in, and land on the home page.
  2. Make the viewport exactly 1140 x 760 CSS px, DPR 2 (DevTools → device
     toolbar → 1140 x 760, DPR 2 → capture screenshot), scroll to the top.
  3. Overwrite modules/network-opt-home.png (do not crop or edit it).
  The 36px strip below + the 1140x760 image is exactly the module area at a
  1440x900 screen; at other sizes the image letterboxes on the tool's own
  background colour, it never stretches.
  ============================================================================
-->
<style>
  :root {
    --brand: #EE4D2D; --brand-bg: #FFF5F0;
    --success: #1CC461; --success-bg: #ECFFF1;
    --warning: #FFB014; --warning-bg: #FFF8DB;
    --g8: #303844; --g7: #7E8692; --g6: #959BA4; --g5: #B5BBC6;
    --g4: #E2E6EC; --g3: #ECF0F4; --g2: #F5F6F9; --g1: #F9FAFC;
    /* the tool's own page background — the letterbox colour, so it blends */
    --tool-bg: #FBFCFE;
    --sans: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); font-size: 13px; color: var(--g8);
    background: var(--tool-bg); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- status strip (the suite already provides the shell chrome) ---------- */
  .bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    height: 36px; padding: 0 12px; background: var(--g1);
    border-bottom: 1px solid var(--g4);
  }
  /* status: the demo is live and usable, not a concept */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
    height: 22px; padding: 0 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
    color: #12925A; background: var(--success-bg); border: 1px solid #BFE6CE;
  }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .meta { font-size: 11.5px; color: var(--g7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp { flex: 1 1 auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px;
    border-radius: 4px; border: 1px solid var(--brand); background: var(--brand); color: #fff;
    font-family: inherit; font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #D8431F; border-color: #D8431F; }
  .btn svg { flex: 0 0 auto; }

  /* ---------- the static home page ---------- */
  .stage { flex: 1 1 auto; min-height: 0; display: flex; background: var(--tool-bg); }
  .stage img {
    width: 100%; height: 100%; object-fit: contain; object-position: top center;
    display: block; user-select: none; -webkit-user-drag: none;
  }
</style>
</head>
<body>

  <div class="bar">
    <span class="pill">Usable demo</span>
    <span class="sp"></span>
    <a class="btn" target="_blank" rel="noopener"
       href="http://sg10.aip.mlp.shopee.io/aip-svc-100287/feedback-network/">
      Open demo
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </div>

  <div class="stage">
    <img src="network-opt-home.png"
         alt="Network Plan Studio home page — plan upload, round-by-round review and the KPI comparison of the current vs optimised network"
         title="Static preview of the Network Plan Studio home page — use Open demo (top right) to run the tool">
  </div>

</body>
</html>
