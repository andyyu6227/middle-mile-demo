<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LH Planner · Middle-Mile Optimization</title>
<!--
  ============================================================================
  LH Planner  —  module page (owner: LH Planner PM)
  ============================================================================
  WHAT THIS PAGE IS
  * The landing view of the module: ONE 1:1 screenshot of Linehaul Planning in
    SPX (task list, Planning Tasks / Result Sets, the task table), captured
    straight from the running tool — no redraw, no mock-up.
        source: https://spx.uat.shopee.co.id/#/linehaul/id-planner
  * The tool needs the Shopee network and an SPX account, so it is never framed
    here; the strip keeps one link out to it.
  * The screenshot is 1140x695 CSS px @2x (2280x1390), i.e. exactly the module
    area at a 1440x900 screen. At other sizes it is contained, never stretched.
    To refresh it: open the tool, land on Linehaul Planning, screenshot at
    1140 wide / DPR 2, overwrite modules/lh-planner-home.png, leave this file
    alone (the strip is the only markup).
  * The earlier interactive concept prototype still lives in
    modules/lh-planner-app.html (month calendar, sealed versions, day detail).
    It is not linked from this page: the landing view must show the real tool.
  ============================================================================
-->
<style>
  :root {
    --brand: #EE4D2D; --brand-bg: #FFF5F0;
    --success: #1CC461; --success-bg: #ECFFF1;
    --g8: #303844; --g7: #7E8692; --g6: #959BA4; --g5: #B5BBC6;
    --g4: #E2E6EC; --g3: #ECF0F4; --g2: #F5F6F9; --g1: #F9FAFC;
    /* the tool's own page background — the letterbox colour, so it blends */
    --tool-bg: #F5F7FB;
    --sans: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); font-size: 13px; color: var(--g8);
    background: var(--tool-bg); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- status strip (the suite already provides the shell chrome) ---------- */
  .bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    height: 36px; padding: 0 12px; background: var(--g1);
    border-bottom: 1px solid var(--g4);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
    height: 22px; padding: 0 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
    color: #12925A; background: var(--success-bg); border: 1px solid #BFE6CE;
  }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .meta { font-size: 11.5px; color: var(--g7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp { flex: 1 1 auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px;
    border-radius: 4px; border: 1px solid var(--brand); background: var(--brand); color: #fff;
    font-family: inherit; font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #D8431F; border-color: #D8431F; }
  .btn svg { flex: 0 0 auto; }

  /* ---------- the static landing page ---------- */
  .stage { flex: 1 1 auto; min-height: 0; display: flex; background: var(--tool-bg); }
  .stage img {
    width: 100%; height: 100%; object-fit: contain; object-position: top center;
    display: block; user-select: none; -webkit-user-drag: none;
  }
</style>
</head>
<body>

  <div class="bar">
    <span class="pill">Usable demo</span>
    <span class="meta">Linehaul Planning — planning tasks by SOC, 1:1 screenshot of the running tool</span>
    <span class="sp"></span>
    <a class="btn" target="_blank" rel="noopener"
       href="https://spx.uat.shopee.co.id/#/linehaul/id-planner">
      Open in SPX UAT
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </div>

  <div class="stage">
    <img src="lh-planner-home.png"
         alt="LH Planner · Linehaul Planning — Planning Tasks list with task status, SOC progress, created by and create / complete times"
         title="1:1 screenshot of LH Planner · Linehaul Planning — use Open in SPX UAT (top right) to run it">
  </div>

</body>
</html>
