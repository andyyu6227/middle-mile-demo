<!DOCTYPE html>

<title>Shopee | Middle-Mile Optimization</title>
<style>
/* ============================================================
   Shopee Supply Chain design tokens (do not invent new colors)
   ============================================================ */
:root {
  /* Brand */
  --color-brand: #EE4D2D;
  --color-brand-hover: #E44A2B;
  --color-brand-bg: #FFF5F0;
  /* Semantic */
  --color-error: #F32345;
  --color-error-bg: #FFF0F0;
  --color-success: #1CC461;
  --color-success-bg: #ECFFF1;
  --color-warning: #FFB014;
  --color-warning-bg: #FFF8DB;
  --color-info: #3274F7;
  --color-info-bg: #F0F7FF;
  --color-info2: #FF831D;
  --color-info2-bg: #FEECE1;
  --color-info3: #1BAF9D;
  --color-info3-bg: #E3F5F3;
  /* Grey Scale */
  --color-grey-9: #222933;
  --color-grey-nav: #0E1723;
  --color-grey-8: #303844;
  --color-grey-7: #7E8692;
  --color-grey-6: #959BA4;
  --color-grey-5: #B5BBC6;
  --color-grey-4: #E2E6EC;
  --color-grey-3: #ECF0F4;
  --color-grey-2: #F5F6F9;
  --color-grey-1: #F9FAFC;
  /* Typography */
  --font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Roboto Mono", "SF Mono", "Courier New", monospace;
  /* Spacing (4px grid) */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
  /* Radius */
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 8px; --radius-xl: 12px; --radius-full: 9999px;
  /* Shadows */
  --shadow-dropdown: 0 4px 12px rgba(0, 0, 0, 0.12);
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-toolbar: 0 2px 4px rgba(0, 0, 0, 0.06);
  /* Transitions */
  --transition-fast: 100ms ease-out;
  --transition-normal: 200ms ease-in-out;
  --transition-slow: 300ms ease-in-out;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-family);
  font-size: 14px;
  color: var(--color-grey-8);
  background: var(--color-grey-2);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #C1C7D0; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
.ico { flex: none; }

/* ============ Sidebar (workspace rail) ============ */
.sidebar {
  width: 252px; background: var(--color-grey-nav);
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 60;
  display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #000;
}
.sb-brand { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #1B2633; }
.sb-glyph {
  width: 32px; height: 32px; border-radius: 6px; flex: none;
  background: linear-gradient(135deg, #EE4D2D 0%, #FF831D 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; font-weight: 800;
  box-shadow: 0 2px 8px rgba(238,77,45,0.35);
}
.sb-name { color: #fff; font-size: 13px; font-weight: 700; line-height: 1.2; letter-spacing: .2px; }
.sb-sub { color: var(--color-grey-7); font-size: 10.5px; line-height: 1.2; margin-top: 3px; white-space: nowrap; }
.sb-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 8px 16px; }
.nav-l1 {
  display: flex; align-items: center; gap: 9px; width: 100%; height: 38px; padding: 0 10px;
  border: none; background: transparent; border-radius: var(--radius-md); color: #fff;
  font-size: 13px; font-weight: 600; letter-spacing: .1px; text-align: left; user-select: none;
}
.nav-l1:hover { background: rgba(255,255,255,0.05); }
.nav-l1 .nav-icon { display: flex; color: var(--color-grey-6); flex: none; }
.nav-l1 .nav-chev { margin-left: auto; display: flex; color: var(--color-grey-7); transition: transform var(--transition-normal); }
.nav-l1.collapsed .nav-chev { transform: rotate(-90deg); }
.nav-l2-group { padding: 2px 0 0; }
.nav-l2 {
  display: flex; align-items: center; gap: 9px; min-height: 34px; padding: 6px 10px 6px 22px;
  margin: 1px 0; border-radius: var(--radius-md); color: #9CA3AE; font-size: 12.5px; line-height: 1.3;
  position: relative; cursor: pointer; user-select: none; transition: background var(--transition-fast), color var(--transition-fast);
}
.nav-l2:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-l2 .nav-icon { display: flex; color: #6B7480; flex: none; }
.nav-l2.active { background: rgba(238,77,45,0.14); color: #fff; }
.nav-l2.active .nav-icon { color: var(--color-brand); }
.nav-l2.active::before {
  content: ''; position: absolute; left: -8px; top: 7px; bottom: 7px; width: 3px;
  background: var(--color-brand); border-radius: 0 2px 2px 0;
}
.sb-foot { flex: none; padding: 10px 12px; border-top: 1px solid #1B2633; display: flex; align-items: center; gap: 9px; }
.sb-foot-name { color: #fff; font-size: 12px; font-weight: 500; line-height: 1.2; }
.sb-foot-meta { color: var(--color-grey-7); font-size: 10.5px; line-height: 1.2; margin-top: 3px; }

/* ============ Main / Topbar ============ */
.main { margin-left: 252px; min-height: 100vh; background: var(--color-grey-2); }
.topbar {
  height: 56px; background: #fff; border-bottom: 1px solid var(--color-grey-3);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-pill { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 6px; border-radius: var(--radius-md); }
.user-pill:hover { background: rgba(0,0,0,0.04); }
.topbar-link { display: inline-flex; align-items: center; gap: 5px; color: var(--color-grey-7); font-size: 12.5px; text-decoration: none; padding: 5px 8px; border-radius: var(--radius-md); }
.topbar-link:hover { color: var(--color-brand); background: rgba(0,0,0,0.04); }
.demo-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 10px;
  background: var(--color-grey-2); color: var(--color-grey-7); font-size: 10.5px; font-weight: 600; letter-spacing: .2px;
}
.demo-chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--color-brand); }
.user-name { font-size: 13px; }
.lv-badge { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; border-radius: 8px; background: var(--color-brand); color: #fff; font-size: 10px; font-weight: 600; letter-spacing: .2px; }
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; flex-wrap: wrap; color: var(--color-grey-7); }
.breadcrumb .sep { color: var(--color-grey-5); }
.bc-link { color: var(--color-grey-7); cursor: pointer; border: none; background: none; font-size: 13px; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
.bc-link:hover { color: var(--color-brand); }
.breadcrumb .current { color: var(--color-grey-8); font-weight: 500; }
.content { padding: 24px; }

/* ============ Components ============ */
.btn {
  height: 32px; padding: 0 16px; border-radius: var(--radius-md); font-size: 14px;
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent; white-space: nowrap;
}
.btn-primary { background: var(--color-brand); color: #fff; border-color: var(--color-brand); }
.btn-primary:hover { background: var(--color-brand-hover); border-color: var(--color-brand-hover); }
.btn-ghost { background: transparent; border-color: var(--color-grey-4); color: var(--color-grey-8); }
.btn-ghost:hover { background: rgba(0,0,0,0.04); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.link { color: var(--color-info); cursor: pointer; background: none; border: none; font-size: 14px; padding: 0; }
.link:hover { opacity: 0.85; }
.icon-btn {
  width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; border-radius: var(--radius-md); color: var(--color-grey-6); cursor: pointer;
}
.icon-btn:hover { background: rgba(0,0,0,0.04); color: var(--color-grey-8); }
.avatar {
  display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-full);
  color: #fff; font-size: 12px; font-weight: 500; flex: none; text-align: center;
}
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; line-height: 16px; white-space: nowrap; }
.b-success { color: var(--color-success); background: var(--color-success-bg); }
.b-error { color: var(--color-error); background: var(--color-error-bg); }
.b-warning { color: var(--color-warning); background: var(--color-warning-bg); }
.b-info { color: var(--color-info); background: var(--color-info-bg); }
.b-info2 { color: var(--color-info2); background: var(--color-info2-bg); }
.b-info3 { color: var(--color-info3); background: var(--color-info3-bg); }
.b-neutral { color: var(--color-grey-7); background: var(--color-grey-2); }
.tag-type { display: inline-flex; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; color: var(--color-grey-8); background: var(--color-grey-2); border: 1px solid var(--color-grey-4); white-space: nowrap; }
.tag-app { display: inline-flex; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; color: var(--color-info); background: var(--color-info-bg); margin-right: 4px; white-space: nowrap; }

.card { background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 20px; }
.card-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; gap: 16px; }
.page-title { font-size: 20px; font-weight: 500; }
.page-desc { font-size: 12px; color: var(--color-grey-7); margin-top: 4px; }

/* Forms */
.input, select.input, textarea.input {
  height: 32px; border: 1px solid var(--color-grey-4); border-radius: var(--radius-md);
  padding: 0 12px; font-size: 14px; color: var(--color-grey-8); background: #fff; outline: none;
}
textarea.input { height: auto; padding: 8px 12px; resize: vertical; }
.input:focus { border-color: var(--color-info); }
.select-wrap { position: relative; display: inline-block; }
.select-wrap select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer; }
.select-wrap .ico { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--color-grey-6); }
.person-select { position: relative; display: inline-block; width: 100%; }
.person-select-trigger {
  display: flex; align-items: center; gap: 8px; height: 32px; border: 1px solid var(--color-grey-4);
  border-radius: var(--radius-md); padding: 0 8px 0 6px; background: #fff; cursor: pointer; user-select: none;
}
.person-select-trigger:hover { border-color: var(--color-info); }
.person-select-trigger .ico { margin-left: auto; color: var(--color-grey-6); }
.person-select-name { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person-select-menu {
  position: absolute; left: 0; right: 0; top: 36px; z-index: 20; background: #fff;
  border-radius: var(--radius-md); box-shadow: var(--shadow-dropdown); max-height: 220px; overflow: auto; display: none;
}
.person-select.open .person-select-menu { display: block; }
.person-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
.person-option:hover { background: #F9FAFC; }
.person-option.selected { color: var(--color-brand); }
.person-option .avatar { pointer-events: none; }
.search-wrap { position: relative; display: inline-block; }
.search-wrap .ico { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--color-grey-6); }
.search-wrap input { padding-left: 32px; }
.form-label { display: block; font-size: 14px; font-weight: 500; color: var(--color-grey-8); margin-bottom: 8px; }
.form-label .req { color: var(--color-error); }
.form-item { margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Table */
.table-card { background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  background: var(--color-grey-2); color: var(--color-grey-8); font-weight: 500; font-size: 14px;
  text-align: left; padding: 12px 14px; white-space: nowrap;
}
.data-table td { padding: 14px 14px; border-bottom: 1px solid var(--color-grey-4); font-size: 14px; vertical-align: middle; }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr { cursor: pointer; }
.data-table tbody tr:hover { background: var(--color-grey-1); }
.cell-primary { font-weight: 500; }
.cell-muted { color: var(--color-grey-7); }
.owner-cell { display: flex; align-items: center; gap: 8px; }
.actions-cell { display: flex; align-items: center; gap: 16px; }
.actions-cell .link { font-size: 14px; }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--color-grey-4); margin-bottom: 20px; }
.tab { padding: 12px 16px; font-size: 14px; color: var(--color-grey-7); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; border-top: none; border-left: none; border-right: none; }
.tab.active { color: var(--color-grey-8); border-bottom-color: var(--color-brand); font-weight: 500; }
.tab:hover { color: var(--color-grey-8); }

/* Switch */
.switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background: var(--color-grey-5); border-radius: var(--radius-full); transition: var(--transition-normal); }
.slider::before { content: ''; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: var(--transition-normal); }
.switch input:checked + .slider { background: var(--color-brand); }
.switch input:checked + .slider::before { transform: translateX(16px); }

/* Detail header */
.detail-head { background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 20px; margin-bottom: 16px; }
.detail-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.detail-name { font-size: 20px; font-weight: 500; }
.detail-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.detail-desc { font-size: 13px; color: var(--color-grey-7); }
.detail-actions { display: flex; gap: 8px; }
.back-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }

/* Modal */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 100; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-dropdown); width: 560px; max-width: 100%; max-height: calc(100vh - 120px); display: flex; flex-direction: column; }
.modal-head { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--color-grey-4); flex: none; }
.modal-title { font-size: 18px; font-weight: 500; }
.modal-body { padding: 24px; overflow: auto; }
.modal-foot { padding: 16px 24px; border-top: 1px solid var(--color-grey-4); display: flex; justify-content: flex-end; gap: 8px; flex: none; }
.rule-add-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
.rule-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--radius-md); background: var(--color-grey-2); font-size: 12px; margin: 0 6px 6px 0; }

/* Drawer */
.drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; opacity: 0; transition: opacity var(--transition-slow); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px; background: #fff; z-index: 91;
  transform: translateX(100%); transition: transform var(--transition-slow); display: flex; flex-direction: column;
  box-shadow: -4px 0 12px rgba(0,0,0,0.12);
}
#drawer-root.open .drawer-mask { opacity: 1; }
#drawer-root.open .drawer { transform: translateX(0); }
.drawer-head { padding: 20px 24px; border-bottom: 1px solid var(--color-grey-4); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex: none; }
.drawer-title { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
.drawer-badges { display: flex; gap: 6px; }
.drawer-body { padding: 20px 24px; overflow: auto; flex: 1; }
.drawer-section { margin-bottom: 24px; }
.drawer-section-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.info-row { display: grid; grid-template-columns: 170px 1fr; gap: 16px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid var(--color-grey-3); }
.info-row:last-child { border-bottom: none; }
.info-row .k { color: var(--color-grey-7); }
.info-row .v { text-align: left; word-break: break-all; }
.flow { display: flex; align-items: center; margin-bottom: 14px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.step-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--color-grey-4); }
.step.active .step-dot { background: var(--color-info); box-shadow: 0 0 0 3px var(--color-info-bg); }
.step.done .step-dot { background: var(--color-success); }
.step-label { font-size: 11px; color: var(--color-grey-6); }
.step.active .step-label { color: var(--color-grey-8); font-weight: 500; }
.step-line { flex: 1; height: 2px; background: var(--color-grey-3); margin: 0 8px 16px; }
.timeline { position: relative; padding-left: 18px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--color-grey-3); }
.tl-item { position: relative; padding-bottom: 16px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { position: absolute; left: -18px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--color-grey-5); }
.tl-item:first-child .tl-dot { border-color: var(--color-brand); }
.tl-text { font-size: 13px; }
.tl-meta { font-size: 12px; color: var(--color-grey-6); margin-top: 2px; }
.comment-item { padding: 10px 12px; background: var(--color-grey-1); border-radius: var(--radius-md); margin-bottom: 8px; }
.comment-author { font-size: 12px; font-weight: 500; }
.comment-time { font-size: 11px; color: var(--color-grey-6); margin-left: 8px; }
.comment-text { font-size: 13px; margin-top: 4px; word-break: break-word; }
.comment-input { display: flex; gap: 8px; margin-top: 4px; }
.comment-input input { flex: 1; }
.resolve-box { display: flex; flex-direction: column; gap: 8px; }
.closed-note { font-size: 13px; color: var(--color-grey-6); }

/* Toast */
#toast-root { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: var(--radius-md); font-size: 14px; box-shadow: var(--shadow-dropdown); opacity: 0; transform: translateY(-8px); transition: var(--transition-slow); }
.toast.show { opacity: 1; transform: translateY(0); }
.toast span { color: var(--color-grey-8); }
.toast-success { background: var(--color-success-bg); }
.toast-success .ico { color: var(--color-success); }
.toast-error { background: var(--color-error-bg); }
.toast-error .ico { color: var(--color-error); }
.toast-info { background: var(--color-info-bg); }
.toast-info .ico { color: var(--color-info); }

.empty { padding: 40px; text-align: center; color: var(--color-grey-6); font-size: 14px; }

/* Config two-column layout */
.cfg-cols{display:flex;gap:32px;align-items:flex-start}.cfg-form{flex:1.1 1 0;min-width:0}.cfg-audit{flex:1 1 0;min-width:0;padding-left:32px;border-left:1px solid var(--color-grey-3)}.cfg-audit .timeline{max-height:300px;overflow:auto}@media(max-width:1023px){.cfg-cols{flex-direction:column}.cfg-audit{padding-left:0;border-left:0;border-top:1px solid var(--color-grey-3);padding-top:16px;margin-top:8px}}

/* =====================================================================
   Suite pages: page head / KPI / panels / Data Gov two-column layout
   ===================================================================== */
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.ph-title { font-size: 20px; font-weight: 500; letter-spacing: -.1px; }
.ph-desc { font-size: 12.5px; color: var(--color-grey-7); margin-top: 5px; max-width: 860px; line-height: 1.55; }
.ph-actions { display: flex; align-items: center; gap: 8px; }
.btn-sm { height: 26px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-md); }
.input-sm { height: 26px; font-size: 11.5px; padding: 0 8px; }

.kpi-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi-card {
  position: relative; background: #fff; border: 1px solid var(--color-grey-4);
  border-radius: var(--radius-md); padding: 13px 15px; overflow: hidden; min-width: 0;
  display: flex; flex-direction: column;
}
.kpi-card .kc-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.kpi-label {
  font-size: 10px; font-weight: 600; color: var(--color-grey-7); text-transform: uppercase;
  letter-spacing: .55px; line-height: 1.35;
}
.kpi-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 17px; padding: 0 6px; border-radius: 3px;
  font-size: 9.5px; font-weight: 600; white-space: nowrap; flex: none; letter-spacing: .2px;
}
.kpi-chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.st-ok { background: var(--color-success-bg); color: #0E8F45; }
.st-bad { background: var(--color-error-bg); color: var(--color-error); }
.st-warn { background: var(--color-warning-bg); color: #B87D00; }
.st-info { background: var(--color-info-bg); color: var(--color-info); }
.st-neutral { background: var(--color-grey-2); color: var(--color-grey-7); }
.kpi-value { display: flex; align-items: baseline; gap: 5px; margin-top: 9px; }
.kpi-value b { font-size: 25px; font-weight: 600; line-height: 1; color: var(--color-grey-8); font-variant-numeric: tabular-nums; }
.kpi-value span { font-size: 11.5px; font-weight: 500; color: var(--color-grey-7); white-space: nowrap; }
.kpi-sub { margin-top: auto; padding-top: 8px; font-size: 10.5px; color: var(--color-grey-7); line-height: 1.4; }

/* Two-column Data Gov layout */
.gov-grid { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 16px; align-items: stretch; }
.panel { background: #fff; border: 1px solid var(--color-grey-4); border-radius: var(--radius-md); min-width: 0; display: flex; flex-direction: column; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--color-grey-3); flex: none; }
.panel-title { font-size: 13.5px; font-weight: 600; color: var(--color-grey-8); }
.panel-count { font-size: 10.5px; font-weight: 600; color: var(--color-grey-7); background: var(--color-grey-2); border-radius: 9px; padding: 2px 7px; }
.panel-head .spacer { flex: 1; min-width: 4px; }
.panel-body { overflow: auto; flex: 1; min-height: 0; }

/* Ticket list (left column) */
.tk-list { padding: 6px; display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow-y: auto; }
.tk-item { position: relative; padding: 10px 11px; border-radius: var(--radius-md); cursor: pointer; border: 1px solid transparent; }
.tk-item:hover { background: var(--color-grey-1); }
.tk-item.sel { background: var(--color-brand-bg); border-color: #FFD9CB; }
.tk-item.sel::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--color-brand); }
.tk-top { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
.tk-id { font-size: 10.5px; font-weight: 600; color: var(--color-grey-7); font-variant-numeric: tabular-nums; letter-spacing: .2px; }
.tk-title { font-size: 12.5px; font-weight: 500; color: var(--color-grey-8); line-height: 1.4; margin-bottom: 7px; }
.tk-meta { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--color-grey-6); }
.tk-ds {
  display: inline-flex; align-items: center; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--color-grey-2); color: var(--color-grey-8); border-radius: 3px; padding: 1px 6px; font-size: 10.5px;
}
.tk-when { margin-left: auto; white-space: nowrap; }
.badge.badge-sm { font-size: 10px; padding: 1px 6px; line-height: 15px; }

/* Dataset table (right column) */
.gov-table { width: 100%; border-collapse: collapse; }
.gov-table th {
  position: sticky; top: 0; z-index: 1; background: #fff; text-align: left;
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--color-grey-7);
  padding: 9px 12px; border-bottom: 1px solid var(--color-grey-4); white-space: nowrap;
}
.gov-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-grey-3); font-size: 12px; vertical-align: middle; }
.gov-table tbody tr { cursor: pointer; }
.gov-table tbody tr:hover { background: var(--color-grey-1); }
.gov-table tbody tr.hl { background: var(--color-brand-bg); }
.gov-table tbody tr.hl td:first-child { box-shadow: inset 3px 0 0 var(--color-brand); }
.gov-table tbody tr:last-child td { border-bottom: none; }
.ds-name { font-size: 12.5px; font-weight: 500; color: var(--color-grey-8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-id { font-size: 10.5px; color: var(--color-grey-6); margin-top: 2px; font-variant-numeric: tabular-nums; }
.ds-apps { display: flex; gap: 3px; flex-wrap: nowrap; }
.ds-app { font-size: 9.5px; padding: 1px 5px; border-radius: 2px; background: var(--color-info-bg); color: var(--color-info); white-space: nowrap; font-weight: 500; }
.owner-cell-sm { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.gov-foot { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--color-grey-3); font-size: 11px; color: var(--color-grey-7); flex: none; }

/* Affected-dataset strip (ticket -> dataset link) */
.affected { margin: 9px 12px 0; padding: 7px 10px; background: var(--color-brand-bg); border: 1px solid #FFD9CB; border-radius: var(--radius-md); }
.af-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.af-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-brand); flex: none; }
.af-k { font-size: 10.5px; font-weight: 600; color: var(--color-brand); font-variant-numeric: tabular-nums; }
.af-name { font-size: 12px; font-weight: 600; color: var(--color-grey-8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.af-meta { font-size: 10.5px; color: var(--color-grey-7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* =====================================================================

.cp-ctl { display: flex; flex-direction: column; gap: 4px; }

.cp-ctl-pill {
  height: 40px; display: flex; align-items: center; padding: 0 12px; white-space: nowrap;
  border: 1px solid var(--color-grey-4); border-radius: var(--radius-lg);

/* ── Alerts card (alert_stack.py) ── */
.cp-alerts { background: #fff; border: 1px solid var(--color-grey-4); border-radius: var(--radius-md); padding: 12px 16px 14px; margin-bottom: 10px; box-shadow: var(--shadow-card); }
.cpa-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.cpa-title { font: 600 14px/1 var(--font-family); color: var(--color-grey-8); }
.cpa-count { font: 400 11px/1 var(--font-family); color: var(--color-grey-7); }
.cpa-rows { display: flex; flex-direction: column; gap: 7px; }
/* collapsible constraint-data row (data_alert.py + style.py .lhc-dtl) */
.lhc-dtl {

}
.lhc-dtl > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 14px; }
.lhc-dtl > summary::-webkit-details-marker { display: none; }
.lhc-dtl > summary::marker { content: ""; }
.lhc-dtl > summary:hover { filter: brightness(0.98); }
.lhc-dtl > summary:focus-visible { outline: 2px solid var(--color-info); outline-offset: -2px; }
.lhc-dtl .lhc-dtl-chev { display: flex; flex-shrink: 0; color: #D0182F; transition: transform 140ms ease; }
.lhc-dtl[open] .lhc-dtl-chev { transform: rotate(180deg); }
.lhc-dtl .lhc-dtl-body { padding: 0 14px 12px 14px; }
.lhc-alert-ic { width: 18px; height: 18px; border-radius: 50%; background: var(--color-error); color: #fff; display: inline-flex; align-items: center; justify-content: center; font: 700 11px/1 var(--font-family); flex-shrink: 0; }
.lhc-alert-title { font: 700 11px/1 var(--font-family); color: #D0182F; letter-spacing: .6px; }
.lhc-alert-count { font: 700 12px/1 var(--font-family); color: #D0182F; font-feature-settings: "tnum"; }
.lhc-alert-reported { font: 400 11px/1.4 var(--font-family); color: var(--color-grey-6); }
.lhb-headline { font: 400 13px/1.55 var(--font-family); color: var(--color-grey-8); }
.lhb-headline b { font-weight: 600; }
.lhb-how { background: #fff; border-radius: 3px; padding: 9px 12px 10px; margin-top: 8px; }
.lhb-how-t { font: 700 10px/1 var(--font-family); color: var(--color-grey-6); letter-spacing: .6px; margin-bottom: 5px; }
.lhb-step { display: flex; gap: 7px; padding: 2px 0; }
.lhb-step i { font: 700 11px/1.6 var(--font-family); color: var(--color-grey-6); font-style: normal; flex-shrink: 0; }
.lhb-step span { font: 400 12px/1.6 var(--font-family); color: var(--color-grey-8); }
.lhb-step a { color: var(--color-info); text-decoration: none; font-weight: 600; cursor: pointer; }
.lhb-cta { margin-top: 12px; }
.lhb-cta .btn-cta { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: var(--radius-md); background: #fff; border: 1px solid var(--color-error); color: var(--color-error); font: 500 13px/1 var(--font-family); }
.lhb-cta .btn-cta:hover { background: var(--color-error-bg); }

/* ── KPI strip (kpi_strip.py) ── */
.lhc-kgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 2px 0 4px; }
.lhc-kc { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 12px 14px; border-left: 4px solid var(--color-grey-4); min-width: 0; }
.lhc-kc-l { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; font: 500 11px/14px var(--font-family); letter-spacing: .04em; color: var(--color-grey-7); text-transform: uppercase; }
.lhc-kc-chip { font: 500 10px/1 var(--font-family); border-radius: 4px; padding: 3px 6px; letter-spacing: .04em; white-space: nowrap; }
.lhc-kc-v { font: 500 24px/26px var(--font-family); color: var(--color-grey-8); margin-top: 8px; white-space: nowrap; }
.lhc-kc-v small { font-size: 12px; font-weight: 400; color: var(--color-grey-7); margin-left: 5px; }
.lhc-kc-d { font: 400 12px/16px var(--font-family); color: var(--color-grey-7); margin-top: 6px; }
.lhc-kc-d b { font-weight: 500; color: var(--color-grey-8); }
.lhc-kc-b { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--color-grey-4); display: flex; flex-direction: column; gap: 6px; }
.lhc-kc-b > div { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 10px; font: 400 12px/16px var(--font-family); color: var(--color-grey-7); }

}
.add-menu button:hover { background: var(--color-brand-bg); color: var(--color-brand); }

.module-frame {
  width: 100%; height: calc(100vh - 104px); border: 0; display: block;

}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Responsive */
@media (max-width: 1399px) {
  .col-apps { display: none; }
  .gov-grid { grid-template-columns: 340px minmax(0, 1fr); }
}
@media (max-width: 1280px) {
  .kpi-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .gov-grid { grid-template-columns: 320px minmax(0, 1fr); }
}
@media (max-width: 1100px) {
  .gov-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 1023px) {

  .main { margin-left: 64px; }

  .sb-brand { justify-content: center; padding: 0; }
  .nav-l1, .nav-l2 { justify-content: center; padding: 0; }
  .nav-l2 { padding-left: 0; }
  .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gov-grid { grid-template-columns: minmax(0, 1fr); }
}

function ic(name, size, cls) {
  size = size || 16; cls = cls || '';
  return '<svg class="ico ' + cls + '" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[name] || '') + '</svg>';
}

function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtAbs(iso) {
  var d = new Date(iso);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtClock(iso) {
  var d = new Date(iso);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function timeAgo(iso) {
  var diff = Date.now() - new Date(iso).getTime();
  var m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + ' h ago';
  var d = Math.floor(h / 24);
  if (d < 30) return d + ' d ago';
  return fmtAbs(iso).slice(0, 10);
}

/* =====================================================================
   4. Data access helpers
   ===================================================================== */
function getDs(id) {
  for (var i = 0; i < DATA.dataSources.length; i++) if (DATA.dataSources[i].id === id) return DATA.dataSources[i];
  return null;
}
function rulesFor(dsId) { return DATA.validationRules.filter(function (r) { return r.dsId === dsId; }); }
function jobsFor(dsId) { return DATA.validationJobs.filter(function (j) { return j.dsId === dsId; }); }
function latestJob(dsId) {
  var list = jobsFor(dsId);
  return list.length ? list[0] : null;
}
function nextRuleId() {
  var max = 1000;
  DATA.validationRules.forEach(function (r) { var n = parseInt(r.id.split('-')[1], 10); if (n > max) max = n; });
  return 'RULE-' + (max + 1);
}
function nextJobId() {
  var max = 0;
  DATA.validationJobs.forEach(function (j) { var n = parseInt(j.id.split('-')[2], 10); if (n > max) max = n; });
  return 'VALIDATE-JOB-' + pad2(max + 1);
}
function nextTicketId() {
  var max = 2041;
  DATA.tickets.forEach(function (t) { var n = parseInt(t.id.split('-')[1], 10); if (n > max) max = n; });
  return 'TKT-' + (max + 1);
}

function breadcrumbFor() {
  if (state.route === 'dsdetail') {
    var ds = getDs(state.detail.dsId);
    return [
      { label: L1_LABEL, nav: 'datagov' },
      { label: 'Data Gov', nav: 'datagov' },
      { label: 'Datasets', nav: 'datagov' },
      { label: ds ? ds.name : 'Dataset detail' }
    ];
  }

  return [{ label: L1_LABEL, nav: 'datagov' }, { label: m.label }];
}

function renderBreadcrumb() {
  var parts = breadcrumbFor();
  var h = '';
  for (var i = 0; i < parts.length; i++) {
    if (i > 0) h += '<span class="sep">/</span>';
    if (parts[i].nav) h += '<button class="bc-link" data-nav="' + parts[i].nav + '">' + esc(parts[i].label) + '</button>';

}

    '<a class="topbar-link" href="architecture.html" target="_blank" rel="noopener">Architecture' + ext + '</a>';

function navigate(route) {
  state.route = route;
  render();
}

/* =====================================================================
   6. Render entry
   ===================================================================== */
function render() {
  renderSidebar();
  renderBreadcrumb();
  renderTopbarExtra();
  closeDrawer();
  var r = state.route;
  if (r === 'lh-copilot') renderCopilot();
  else if (r === 'lh-planner' || r === 'network-opt' || r === 'simulation') renderModuleOrPending(r);
  else if (r === 'dsdetail') renderDetailPage();
  else renderDataGov();

function tinyBadge(map, key) {
  var m = map[key] || { label: key, cls: 'b-neutral' };

}
function appTagsSmall(apps) {
  var short = { 'Network Optimization Toolbox': 'Network Opt.' };

    return '<span class="ds-app">' + esc(short[a] || a) + '</span>';
  }).join('') + '</div>';

function renderDataGov() {
  var ds = DATA.dataSources;
  var online = ds.filter(function (d) { return d.status === 'online'; }).length;
  var offline = ds.filter(function (d) { return d.status === 'offline'; }).length;
  var abnormal = ds.filter(function (d) { return d.status === 'bug' || d.status === 'degraded'; }).length;
  var openTickets = DATA.tickets.filter(function (t) { return t.status === 'Open' || t.status === 'In Progress' || t.status === 'Validating'; }).length;
  var done = DATA.validationJobs.filter(function (j) { return j.result !== 'Running'; });
  var pass = done.filter(function (j) { return j.result === 'Passed'; }).length;
  var passRate = done.length ? Math.round(pass / done.length * 100) : 0;

  var appSet = {};
  ds.forEach(function (d) { (d.apps || []).forEach(function (a) { appSet[a] = 1; }); });
  var appCount = Object.keys(appSet).length;
  var kpis = [
    { label: 'Datasets', value: ds.length, unit: 'tracked', chip: ['All sources', 'st-neutral'], sub: 'Consumed by ' + appCount + ' upstream middle-mile products' },
    { label: 'Online', value: online, chip: ['Healthy', 'st-ok'], sub: Math.round(online / ds.length * 100) + '% of the catalog refreshing on time', accent: 'var(--color-success)' },
    { label: 'Offline', value: offline, chip: ['Needs attention', 'st-neutral'], sub: 'No refresh beyond the expected frequency', accent: offline ? 'var(--color-grey-5)' : '' },
    { label: 'Data issues', value: abnormal, chip: ['Bug / Degraded', 'st-bad'], sub: 'Can block downstream plan generation', accent: 'var(--color-error)' },

  ];

  $('#content').innerHTML =
    '<div class="ph">' +
      '<div><div class="ph-title">Data Governance</div>' +
      '<div class="ph-desc">One control plane for every dataset the middle-mile products consume — status, owner PIC, validation results and the tickets raised when data breaks an upstream product. Select a ticket to trace the dataset behind it.</div></div>' +
    '</div>' +

      '<section class="panel" id="tickets-panel">' + ticketsPanelHTML() + '</section>' +
      '<section class="panel" id="datasets-panel">' + datasetsPanelHTML() + '</section>' +

/* =====================================================================
   12. Ticket drawer + status flow
   ===================================================================== */
function drawerHTML(t) {
  var ds = getDs(t.dsId);
  var order = ['Open', 'In Progress', 'Validating', 'Resolved', 'Closed'];
  var idx = order.indexOf(t.status);
  var steps = order.map(function (s, i) {
    var done = (t.status === 'Closed' && i <= idx) || i < idx;
    var active = i === idx && t.status !== 'Closed';
    return '<div class="step ' + (done ? 'done' : '') + (active ? 'active' : '') + '"><span class="step-dot"></span><span class="step-label">' + esc(s) + '</span></div>';
  }).join('<div class="step-line"></div>');

  var actionHtml = '';
  if (t.status === 'Open') actionHtml = '<button class="btn btn-primary" data-action="advance-ticket" data-id="' + t.id + '">Start → In Progress</button>';
  else if (t.status === 'In Progress') actionHtml = '<div class="resolve-box"><input id="resolution-note" class="input" placeholder="Resolution note (optional)"><button class="btn btn-primary" data-action="advance-ticket" data-id="' + t.id + '">Mark Resolved → Validate</button></div>';
  else if (t.status === 'Validating') actionHtml = '<span class="closed-note">Validating — system re-running validation rules…</span>';
  else if (t.status === 'Resolved') actionHtml = '<button class="btn btn-primary" data-action="advance-ticket" data-id="' + t.id + '">Close Ticket → Closed</button>';
  else actionHtml = '<span class="closed-note">Ticket is closed</span>';

  var timeline = t.timeline.slice().sort(function (a, b) { return new Date(a.time) - new Date(b.time); }).map(function (tl) {
    return '<div class="tl-item"><span class="tl-dot"></span><div class="tl-text">' + esc(tl.text) + '</div><div class="tl-meta">' + esc(tl.actor) + ' · ' + esc(fmtAbs(tl.time)) + '</div></div>';
  }).join('');

  var comments = t.comments.map(function (c) {
    return '<div class="comment-item"><div><span class="comment-author">' + esc(c.author) + '</span><span class="comment-time">' + esc(fmtAbs(c.time)) + '</span></div><div class="comment-text">' + esc(c.text) + '</div></div>';
  }).join('') || '<div class="cell-muted" style="font-size:13px;margin-bottom:8px">No comments yet</div>';

  return '<div class="drawer-head"><div>' +
    '<div class="drawer-title">' + esc(t.id) + ' · ' + esc(t.title) + '</div>' +
    '<div class="drawer-badges">' + badge(TSTATUS, t.status) + badge(PRI, t.priority) + '</div>' +
    '</div><button class="icon-btn" data-action="drawer-close">' + ic('close', 16) + '</button></div>' +
    '<div class="drawer-body">' +
    '<div class="drawer-section"><div class="drawer-section-title">Basic Info</div>' +
    '<div class="info-row"><span class="k">Dataset</span><span class="v">' + esc(ds ? ds.name : t.dsId) + ' (' + esc(t.dsId) + ')</span></div>' +
    '<div class="info-row"><span class="k">Assignee</span><span class="v">' + personChip(t.assignee) + '</span></div>' +
    '<div class="info-row"><span class="k">Creator</span><span class="v">' + esc(t.creator) + '</span></div>' +
    '<div class="info-row"><span class="k">Created At</span><span class="v">' + esc(fmtAbs(t.createdAt)) + '</span></div>' +
    '<div class="info-row"><span class="k">Updated At</span><span class="v">' + esc(fmtAbs(t.updatedAt)) + '</span></div>' +
    (t.resolutionNote ? '<div class="info-row"><span class="k">Resolution Note</span><span class="v">' + esc(t.resolutionNote) + '</span></div>' : '') +
    '</div>' +
    '<div class="drawer-section"><div class="drawer-section-title">Status Flow</div><div class="flow">' + steps + '</div>' + actionHtml + '</div>' +
    '<div class="drawer-section"><div class="drawer-section-title">Timeline</div><div class="timeline">' + timeline + '</div></div>' +
    '<div class="drawer-section"><div class="drawer-section-title">Comments</div>' + comments +
    '<div class="comment-input"><input id="comment-text" class="input" placeholder="Add a comment, press Enter to send"><button class="btn btn-primary" data-action="add-comment" data-id="' + t.id + '">' + ic('send', 14) + ' Send</button></div></div>' +
    '</div>';
}

function openTicketDrawer(id) {
  var t = DATA.tickets.find(function (x) { return x.id === id; });
  if (!t) return;
  state.currentTicket = id;
  renderDrawerInto(t);
  $('#drawer-root').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function refreshTicketDrawer(id) {
  var t = DATA.tickets.find(function (x) { return x.id === id; });
  if (!t) return;
  var d = $('#drawer-root .drawer');
  if (d) d.innerHTML = drawerHTML(t);
}
function renderDrawerInto(t) {
  $('#drawer-root').innerHTML = '<div class="drawer-mask"></div><div class="drawer">' + drawerHTML(t) + '</div>';
}
function closeDrawer() {
  state.currentTicket = null;
  var root = $('#drawer-root');
  root.classList.remove('open');
  if (!currentModal) document.body.style.overflow = '';
  setTimeout(function () { if (!$('#drawer-root').classList.contains('open')) $('#drawer-root').innerHTML = ''; }, 300);
}

function advanceTicket(id) {
  var t = DATA.tickets.find(function (x) { return x.id === id; });
  if (!t) return;
  var order = ['Open', 'In Progress', 'Validating', 'Resolved', 'Closed'];
  var idx = order.indexOf(t.status);
  if (idx < 0 || idx >= order.length - 1) return;
  var next = order[idx + 1];
  var note = '';
  if (t.status === 'In Progress') {
    var el = $('#resolution-note');
    note = el ? el.value.trim() : '';
    if (note) t.resolutionNote = note;
  }
  t.status = next;
  t.updatedAt = new Date().toISOString();
  var text;
  if (next === 'Validating') text = 'Status changed to Validating' + (note ? ' · ' + note : '') + ' — system validation triggered';
  else if (next === 'Resolved') text = 'Status changed to Resolved';
  else text = 'Status changed to ' + next;
  t.timeline.push({ time: t.updatedAt, actor: 'Huaian', text: text });
  toast('Ticket ' + id + ' status updated to ' + next);
  refreshTicketPanels();
  refreshTicketDrawer(id);
  if (next === 'Validating') {
    setTimeout(function () {
      var tk = DATA.tickets.find(function (x) { return x.id === id; });
      if (!tk || tk.status !== 'Validating') return;
      var now = new Date().toISOString();
      tk.status = 'Resolved';
      tk.updatedAt = now;
      tk.timeline.push({ time: now, actor: 'System', text: 'Validation passed — issue confirmed resolved' });
      toast('Ticket ' + id + ' validation passed → Resolved');
      refreshTicketPanels();
      refreshTicketDrawer(id);
    }, 2500);
  }
}

function addComment(id) {
  var t = DATA.tickets.find(function (x) { return x.id === id; });
  if (!t) return;
  var el = $('#comment-text');
  var txt = el ? el.value.trim() : '';
  if (!txt) return;
  var now = new Date().toISOString();
  t.comments.push({ author: 'Huaian', time: now, text: txt });
  t.timeline.push({ time: now, actor: 'Huaian', text: 'Comment added: ' + txt });
  t.updatedAt = now;
  if (el) el.value = '';
  refreshTicketPanels();
  refreshTicketDrawer(id);
}

/* =====================================================================
   15. Modal / Drawer / Toast basics
   ===================================================================== */
var currentModal = null;

function toast(msg, type) {
  type = type || 'success';
  var root = $('#toast-root');
  var t = document.createElement('div');
  t.className = 'toast toast-' + type;
  var iconName = type === 'success' ? 'check' : (type === 'error' ? 'warn' : 'alert');
  t.innerHTML = ic(iconName, 16) + '<span>' + esc(msg) + '</span>';
  root.appendChild(t);
  requestAnimationFrame(function () { t.classList.add('show'); });
  setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 3000);
}

function openModal(opts) {
  var root = $('#modal-root');
  var mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = '<div class="modal" style="' + (opts.width ? 'max-width:' + opts.width + ';width:100%' : '') + '">' +
    '<div class="modal-head"><div class="modal-title">' + (opts.title || '') + '</div><button class="icon-btn" data-action="modal-close">' + ic('close', 16) + '</button></div>' +
    '<div class="modal-body">' + (opts.body || '') + '</div>' +
    (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
    '</div>';
  root.appendChild(mask);
  mask.addEventListener('click', function (e) { if (e.target === mask) closeModal(); });
  var btn = mask.querySelector('[data-action="modal-close"]');
  if (btn) btn.addEventListener('click', closeModal);
  currentModal = mask;
  document.body.style.overflow = 'hidden';
  return mask;
}
function closeModal() {
  if (currentModal) { currentModal.remove(); currentModal = null; }
  if (!$('#drawer-root').classList.contains('open')) document.body.style.overflow = '';
}

/* =====================================================================
   16. Global event delegation
   ===================================================================== */
function handleAction(a) {
  var act = a.getAttribute('data-action');
  var id = a.getAttribute('data-id');
  switch (act) {
    case 'view-ds': openDetail(id); break;
    case 'edit-ds': openDataSourceModal(id); break;
    case 'detail-tab': state.detail.tab = a.getAttribute('data-tab'); renderDetailPage(); break;
    case 'run-validation': runValidation(id); break;
    case 'save-config': saveConfig(id); break;
    case 'cancel-config': state.detail.tab = 'config'; renderDetailPage(); break;
    case 'open-add-rule': openRuleModal(null, a.getAttribute('data-ds') || null); break;
    case 'edit-rule': openRuleModal(id, null); break;
    case 'del-rule': deleteRule(id); break;
    case 'toggle-rule': toggleRule(id, a); break;
    case 'select-ticket': selectTicket(id); break;
    case 'toggle-add-menu': toggleAddMenu(); break;
    case 'new-dataset': closeAddMenu(); openNewDatasetModal(); break;
    case 'new-rule': closeAddMenu(); openRuleModal(null, null); break;
    case 'goto-ticket': state.selectedTicket = id; navigate('datagov'); break;
    case 'open-ticket': openTicketDrawer(id); break;
    case 'drawer-close': closeDrawer(); break;
    case 'advance-ticket': advanceTicket(id); break;
    case 'add-comment': addComment(id); break;
    case 'modal-close': closeModal(); break;
    case 'apply-bridge': toast('Bridge parameters applied to the next planning run', 'info'); break;
    default: break;
  }
}

function runValidation(dsId) {
  var ds = getDs(dsId);
  var rules = rulesFor(dsId);
  var id = nextJobId();
  DATA.validationJobs.unshift({
    id: id, name: ds.name + ' · Manual validation', dsId: dsId, ruleCount: rules.length,
    schedule: 'Manual trigger', lastRun: new Date().toISOString(), duration: '—',
    rowsChecked: 0, rowsFailed: 0, result: 'Running', passRate: null, nextRun: null
  });
  toast('Validation job ' + id + ' triggered');
  // Demo: auto-mark as passed after 2.5s
  setTimeout(function () {
    var j = DATA.validationJobs.find(function (x) { return x.id === id; });
    if (j) {
      j.result = 'Passed'; j.passRate = 100; j.duration = '2.8s';
      j.rowsChecked = Math.floor(100000 + Math.random() * 900000); j.rowsFailed = 0;
    }
    if (state.route === 'dsdetail') renderDetailPage();
    else render();
  }, 2500);
}

function saveConfig(dsId) {
  var ds = getDs(dsId);
  ds.timeline = ds.timeline || [];
  var oldName = ds.owner.name;
  var pic = $('#cfg-pic').value;
  var p = findPerson(pic);
  var now = new Date().toISOString();
  var newFreq = $('#cfg-freq').value;
  var newVersion = $('#cfg-version').value.trim() || ds.meta.version;
  var newSla = $('#cfg-sla').value;
  var newRetention = $('#cfg-retention').value;
  var newSensitivity = $('#cfg-sensitivity').value;
  if (oldName !== p.name) ds.timeline.push({ time: now, actor: 'Huaian', text: 'Owner PIC changed: ' + oldName + ' → ' + p.name });
  if (ds.freq !== newFreq) ds.timeline.push({ time: now, actor: 'Huaian', text: 'Update frequency changed: ' + ds.freq + ' → ' + newFreq });
  if (ds.meta.version !== newVersion) ds.timeline.push({ time: now, actor: 'Huaian', text: 'Data version changed: ' + ds.meta.version + ' → ' + newVersion });
  if (ds.meta.sla !== newSla) ds.timeline.push({ time: now, actor: 'Huaian', text: 'SLA changed: ' + ds.meta.sla + ' → ' + newSla });
  if (ds.meta.retention !== newRetention) ds.timeline.push({ time: now, actor: 'Huaian', text: 'Retention changed: ' + ds.meta.retention + ' → ' + newRetention });
  if (ds.meta.sensitivity !== newSensitivity) ds.timeline.push({ time: now, actor: 'Huaian', text: 'Sensitivity changed: ' + ds.meta.sensitivity + ' → ' + newSensitivity });
  ds.owner = { name: p.name, color: p.color };
  ds.freq = newFreq;
  ds.meta.version = newVersion;
  ds.meta.sla = newSla;
  ds.meta.retention = newRetention;
  ds.meta.sensitivity = newSensitivity;
  toast('Saved');
  renderDetailPage();
}

function deleteRule(id) {
  DATA.validationRules = DATA.validationRules.filter(function (r) { return r.id !== id; });
  toast('Rule deleted');
  render();
}

function toggleRule(id, checkbox) {
  var r = DATA.validationRules.find(function (x) { return x.id === id; });
  if (r) {
    r.enabled = checkbox.checked;
    toast(r.enabled ? 'Rule enabled' : 'Rule disabled', 'info');
  }
}

function setAlertStatus(id, status, label) {
  /* unused — tickets are auto-generated, no manual alert flow */
}

/* =====================================================================
   18. Boot
   ===================================================================== */
render();

</script>
</body>
</html>
